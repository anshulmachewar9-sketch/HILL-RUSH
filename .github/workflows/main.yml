
name: Build HILL RUSH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Create build folder
        run: mkdir -p build

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/HILL_RUSH.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILL-RUSH-Android-APK
          path: build/HILL_RUSH.apk
          
